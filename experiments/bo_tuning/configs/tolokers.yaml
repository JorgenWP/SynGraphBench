# BO tuning config — tolokers
#
# Fixed BiGG HPs (held constant across every trial in this study). Tuned HPs
# (lr, kl_weight, lw_cont, lw_label) come from search_space.suggest_params.

dataset: tolokers

fixed_hp:
  dataset:            tolokers
  n_splits:           5
  n_subgraphs:        11          # K of metis_K5 partition
  blksize:            -1
  batch_size:         1
  epochs:             300
  embed_dim:          256
  noise_std:          0.3
  ss_max_prob:        0.3
  ss_start_epoch:     0
  bfs_preprocess:     True       # python-cased — train_bigg_subsample.sh passes through
  normalize:          cdf
  hetero_feat:        False
  mask_test_labels:   True
  logvar_floor:       -10.0
  binary_feat:        True
  vae_feat:           True
  vae_dim:            16
  mdn_feat:           True
  mdn_components:     8
  mdn_logsigma_floor: -10.0
  mdn_base:           logit_normal
  kl_schedule:        none
  kl_anneal_epochs:   0
  kl_cycle_epochs:    0
  kl_ramp_ratio:      0.5
  load_subsamples:    True
  subsampling_config: uniform_ts2500_K15
  recal_momentum:     1.0
  min_subgraph_nodes: 0          # drop loaded partitions below this many nodes; 0 = no filter
  # required by the shell wrapper but unused under load_subsamples=True
  subsample_size:     2000
  burn_prob:          0.3
  num_subgraphs:      ''
  cat_feat:           False
  n_bins:             32
  bin_sigma:          ''

# Override DEFAULT_BOUNDS from search_space.py here if needed.
search_space: {}

seeds_per_split:  3
tune_test_ratio:  0.5
tune_test_seed:   20260523
tune_portion:     tune

models: [GCN, GIN, GraphSAGE, XGBGraph, XGBoost]

benchmark:
  # Benchmark runs in the bigg env (unified env carrying BiGG + GADBench deps).
  # The BO coordinator (also in bigg) resolves this name to an absolute python
  # via `conda info --json` at runtime, so the same config works on any host
  # where the env is named "bigg". Override with `python: /abs/path` to bypass
  # the lookup.
  conda_env:  bigg
  epochs:     200
  patience:   50
  lr:         0.01
  drop_rate:  0.0
  h_feats:    32
  num_layers: 2
